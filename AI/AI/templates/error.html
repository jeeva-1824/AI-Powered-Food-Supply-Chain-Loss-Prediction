{% extends "base.html" %}

{% block title %}Error {{ code }}{% endblock %}
{% block page_title %}System Error{% endblock %}

{% block content %}
<div class="row min-vh-50 align-items-center justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card-startup py-5 px-4 shadow-lg border-0" style="margin-top: 40px;">
            <div class="mb-4">
                <i class="fas fa-circle-exclamation text-danger fa-4x mb-3"></i>
                <h1 class="display-4 fw-800 text-danger">{{ code }}</h1>
                <h4 class="mb-3">{{ msg }}</h4>
                <p class="text-muted mb-4">The route or resource you requested is unavailable or restricted.</p>
            </div>
            
            <div class="d-flex gap-3 justify-content-center">
                <a href="{{ url_for('dashboard') }}" class="btn btn-primary-startup">
                    <i class="fas fa-house me-2"></i> Return Home
                </a>
                <a href="{{ url_for('contact') }}" class="btn btn-light-startup">
                    <i class="fas fa-headset me-2"></i> Contact Support
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
