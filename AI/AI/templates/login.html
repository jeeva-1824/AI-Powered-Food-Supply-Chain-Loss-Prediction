<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgroRoute AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

<div class="d-flex align-items-center justify-content-center vh-100 px-3">
    <div class="card shadow-sm border-0 rounded-4 p-4 auth-card-main" style="max-width: 420px; width: 100%;">
        <div class="text-center mb-4">
            <h1 class="h3 fw-bold">Farm<span class="text-primary">Shield</span></h1>
            <p class="text-muted mb-0">Secure logistics intelligence for food supply chains.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} small py-2 border-0 shadow-sm mb-3">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('login') }}" method="POST" class="row g-3">
            <div class="col-12">
                <label class="form-label small text-dark fw-semibold">Email Address</label>
                <div class="input-group input-icon-group">
                    <span class="input-group-text bg-white border-0"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" name="email" class="form-control border-0 shadow-sm" placeholder="name@company.com" value="{{ request.form.email or '' }}" required>
                </div>
            </div>

            <div class="col-12">
                <label class="form-label small text-dark fw-semibold">Password</label>
                <div class="input-group input-icon-group">
                    <span class="input-group-text bg-white border-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-0 shadow-sm" placeholder="••••••••" required>
                </div>
            </div>

            <div class="col-12 d-flex justify-content-between align-items-center">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label small text-muted" for="remember">Remember me</label>
                </div>
                <a href="#" class="small text-primary">Forgot password?</a>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary w-100 py-3 rounded-3">Sign In</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <p class="small text-muted mb-0">No account yet? <a href="{{ url_for('signup') }}" class="fw-semibold text-primary">Create one</a></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
